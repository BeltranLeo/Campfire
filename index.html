<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campfire</title>
    <meta name="description" content="Buy or sell Bitcoin Cash directly with another person. No exchange holds your money: a contract on the Bitcoin Cash network locks the seller’s coins until the payment is done." />
    <!-- Link previews (Telegram, WhatsApp, X, Discord). Crawlers read this static HTML and never run the app, so
         every route (#/offers, #/roadmap…) shares this one preview: the hash never reaches the server. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Campfire" />
    <meta property="og:url" content="https://campfire.cash/" />
    <meta property="og:title" content="Campfire: buy or sell Bitcoin Cash directly with another person" />
    <meta property="og:description" content="Non-custodial P2P exchange. A contract on the Bitcoin Cash network locks the seller’s coins until the payment is done, so Campfire never holds your money. In beta on mainnet." />
    <meta property="og:image" content="https://campfire.cash/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Campfire logo with the text: Buy or sell Bitcoin Cash directly with another person. Beta on mainnet, campfire.cash." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_LA" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/src/web/logos/symbol-64.png" />
    <script>
      // Set the theme before the first paint so a dark-mode visitor never sees a light flash.
      // Must match src/web/theme.ts: localStorage.theme is 'light', 'dark' or absent (follow the system).
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {}
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root" class="cf s-screen"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
